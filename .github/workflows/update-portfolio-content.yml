name: Update portfolio content

on:
  workflow_dispatch:
    inputs:
      content_json:
        description: "Complete content.json payload. Use the file in the repository as the template."
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-content:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate and write content
        env:
          CONTENT_JSON: ${{ inputs.content_json }}
        run: |
          python - <<'PY'
          import json, os
          payload = json.loads(os.environ["CONTENT_JSON"])
          required = {"settings", "hero", "about", "journey", "projects", "archive"}
          missing = required - payload.keys()
          if missing:
              raise SystemExit(f"Missing required content sections: {', '.join(sorted(missing))}")
          with open("content.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          PY

      - name: Publish content to main
        run: |
          git config user.name "portfolio-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.json
          git diff --cached --quiet && exit 0
          git commit -m "Update portfolio content"
          git push origin main
